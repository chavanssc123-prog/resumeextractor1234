{% extends "base.html" %}{% block title %}Login · Resume Extractor{% endblock %}{% block content %}
<div class="auth-card"><h1>Welcome back</h1><p class="muted">Sign in to your resume dashboard.</p>
<form method="post"><label class="form-label">Username</label><input class="form-control mb-3" name="username" required>
<label class="form-label">Password</label><input class="form-control mb-3" type="password" name="password" required>
<button class="btn btn-primary w-100">Login</button></form><p class="mt-3 mb-0">New user? <a href="{{ url_for('register') }}">Create an account</a></p></div>{% endblock %}
