{% extends "base.html" %}{% block title %}Register · Resume Extractor{% endblock %}{% block content %}
<div class="auth-card"><h1>Create account</h1><form method="post"><label class="form-label">Username</label><input class="form-control mb-3" name="username" required>
<label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required>
<label class="form-label">Password (minimum 8 characters)</label><input class="form-control mb-3" type="password" name="password" minlength="8" required>
<button class="btn btn-primary w-100">Register</button></form><p class="mt-3 mb-0">Already registered? <a href="{{ url_for('login') }}">Login</a></p></div>{% endblock %}
